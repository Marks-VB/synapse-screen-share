<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050811" />
    <meta name="description" content="Ultra-responsive Cyberpunk WebRTC screen-sharing and terminal communication system." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Synapse" />
    <title>SYNAPSE // Real-Time Screen Share</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-cyber-black text-slate-200 min-h-screen overflow-hidden scanline-grid select-none">
    <div id="root">
      <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; width:100vw; background:#020408; font-family:'JetBrains Mono', monospace; color:#00f3ff; user-select:none;">
        <div style="position:relative; width:48px; height:48px; margin-bottom:16px;">
          <div style="width:100%; height:100%; border:2px solid rgba(0,243,255,0.2); border-radius:50%; box-sizing:border-box;"></div>
          <div style="position:absolute; top:0; left:0; width:100%; height:100%; border:2px solid transparent; border-top-color:#00f3ff; border-radius:50%; animation:synapseSpin 0.8s linear infinite; box-sizing:border-box;"></div>
        </div>
        <div style="font-size:11px; font-weight:bold; letter-spacing:0.25em; text-transform:uppercase; color:#e2e8f0;">
          SYNAPSE <span style="color:#00f3ff;">//</span> BOOTING KERNEL...
        </div>
        <style>@keyframes synapseSpin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
